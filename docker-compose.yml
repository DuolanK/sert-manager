services:
    # PHP (Laravel) backend
    backend:
        platform: linux/amd64
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: task-manager-backend
        container_name: task-manager-backend
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        working_dir: /var/www
        volumes:
            - ./backend:/var/www
        environment:
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            APP_KEY: ${APP_KEY}
            JWT_SECRET: ${JWT_SECRET}
            REDIS_HOST: redis
            REDIS_CLIENT: ${REDIS_CLIENT:-predis}
            CACHE_STORE: ${CACHE_STORE:-redis}
        networks:
            - task-network
        entrypoint: >
            sh -c "
            composer install --no-interaction 2>/dev/null || composer update --no-interaction &&
            php artisan migrate --force &&
            php artisan db:seed --force &&
            chown -R www-data:www-data storage bootstrap/cache &&
            php-fpm
            "
        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # Nginx web server
    nginx:
        platform: linux/amd64
        image: nginx:alpine
        container_name: task-manager-nginx
        restart: unless-stopped
        ports:
            - "${BACKEND_PORT:-6162}:80"
        depends_on:
            - backend
        volumes:
            - ./backend:/var/www
            - ./docker-compose/nginx:/etc/nginx/conf.d
        networks:
            - task-network
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # Frontend (Next.js)
    frontend:
        platform: linux/amd64
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                API_PROXY_TARGET: ${API_PROXY_TARGET:-http://nginx}
        image: task-manager-frontend
        container_name: task-manager-frontend
        restart: unless-stopped
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        depends_on:
            - backend
        networks:
            - task-network
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s

    # PostgreSQL database
    db:
        image: postgres:16
        container_name: task-manager-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - task-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 5s
            timeout: 5s
            retries: 5

    # Redis (cache)
    redis:
        image: redis:7-alpine
        container_name: task-manager-redis
        restart: unless-stopped
        networks:
            - task-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 3

    # PgAdmin (optional)
    pgadmin:
        image: dpage/pgadmin4
        container_name: task-manager-pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
        ports:
            - "${PGADMIN_PORT:-5050}:80"
        networks:
            - task-network

volumes:
    pgdata:

networks:
    task-network:
        driver: bridge
